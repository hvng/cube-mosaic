<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cube Mosaic</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Cube Mosaic</h1>

  <input type="file" id="imageInput" accept="image/*" />

  <div class="controls">
    <label>
      Grid width (cubes):
      <input type="number" id="gridWidth" value="10" min="1" max="200">
    </label>

    <label>
      Cube type:
      <select id="cubeSubdivision">
        <option value="3" selected>3 × 3</option>
        <option value="4">4 × 4</option>
      </select>
    </label>

    <label>
      Pixel size (px):
      <input type="number" id="squareSize" value="8" min="2" max="20">
    </label>

    <button id="generateGrid">Generate</button>
  </div>

  <canvas id="canvas"></canvas>

  <script src="app.js"></script>
</body>
</html>
